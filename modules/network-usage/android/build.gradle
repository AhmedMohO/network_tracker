plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.networkusage'
version = '0.1.0'

android {
  namespace "expo.modules.networkusage"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// No `dependencies` block on purpose. `SyncKeepAlive` needs to call
// expo-background-task's consumer, but expo modules are not Gradle projects
// here — they resolve as Maven artifacts
// (`host.exp.exponent:expo.modules.backgroundtask:<version>`), so depending on
// one from this module would mean pinning a version that has to be bumped in
// lockstep with package.json. It reaches the class by name instead; see the
// comment on `SyncKeepAlive.runBackgroundTasks`.
